<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page not found — Anastasiia Artiukhova</title>

  <link
    rel="icon"
    type="image/png"
    href="/C5405A5F-56C1-4DFD-A976-4DECEE183AC2.png"
  >

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f7f1e8;
      color: #2b201d;
      font-family: Arial, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }

    .error-page {
      width: 100%;
      max-width: 720px;
      text-align: center;
      padding: 60px 24px;
      border: 1px solid rgba(79, 45, 57, 0.14);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.28);
    }

    .error-code {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 400;
      color: #4f2d39;
    }

    h1 {
      margin: 0 0 18px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 7vw, 3.5rem);
      font-weight: 400;
    }

    p {
      max-width: 520px;
      margin: 0 auto 32px;
      color: #6d5850;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 14px 24px;
      border-radius: 999px;
      background: #4f2d39;
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="error-page">
    <div class="error-code">404</div>

    <h1>Page not found</h1>

    <p>
      The page you’re looking for doesn’t exist or may have been moved.
    </p>

    <a href="/">Back to homepage</a>
  </main>

</body>
</html>
